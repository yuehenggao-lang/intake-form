[build]
  publish = "."
  functions = "netlify/functions"

# Friendly URLs: /api/intake -> /.netlify/functions/intake
[[redirects]]
  from = "/api/intake"
  to   = "/.netlify/functions/intake"
  status = 200

[[redirects]]
  from = "/api/upload"
  to   = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/consult"
  to   = "/.netlify/functions/consult"
  status = 200

# Optional pretty paths for the two pages
[[redirects]]
  from = "/intake"
  to   = "/index.html"
  status = 200

[[redirects]]
  from = "/upload"
  to   = "/upload.html"
  status = 200

[[redirects]]
  from = "/consult"
  to   = "/consult.html"
  status = 200

# 🔴 **免费 TRV 工具暂时下架**（Steven 2026-08-24）。
#
# 它跟「没有免费的了，全部收费」直接冲突，而产品还没对外，所以先藏起来。
# 用**重定向**下架而不是删目录：删了要重新找回来，改一行就能放回来。
#
#     from = "/trv" → "/"        # 现在：谁点进来都回首页
#     恢复时把下面两块换回原来那一条：from "/trv" → "/trv-tool/" 301
#
# `/trv-tool/*` 也一并挡住 —— 只挡 `/trv` 的话，知道真实路径的人照样进得去
# （链接分享过、也可能被搜索引擎收录了）。
[[redirects]]
  from = "/trv"
  to   = "/"
  status = 302

[[redirects]]
  from = "/trv-tool/*"
  to   = "/"
  status = 302
